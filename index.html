<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estación Bilingüe</title>

<!-- Configuraciones nativas para comportamiento de App de Audio Móvil -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilingüe">
<meta name="theme-color" content="#25333c">

<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#25333c;
  --panel:#1d2830;
  --panel-2:#2f4049;
  --ink:#f3eee3;
  --ink-dim:#9fb2ba;
  --ink-faint:#6d818a;
  --line:#3d505a;
  --es:#e2483c;
  --es-dim:#5a2e29;
  --de:#3fa38d;
  --de-dim:#204540;
  --zh:#d98a4f;
  --zh-dim:#5a3a20;
  --amber:#eaa23a;
  --radius:14px;
  --font-ui:'Space Grotesk',sans-serif;
  --font-voice:'Fraunces',serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px 64px;
}
.app-container{width:100%;max-width:760px;}

/* Estructura limpia para alternar pantallas */
.gate{
  width:100%; display:flex; align-items:center; justify-content:center; min-height:70vh;
}
.app{
  width:100%; display:none; /* Oculto estrictamente al inicio */
}

.gate-inner{text-align:center;width:100%;}
.gate-inner h1{font-size:30px;font-weight:600;margin:0 0 6px;}
.gate-inner .tagline{color:var(--ink-dim);font-size:14px;margin:0 0 40px;}
.gate-buttons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.gate-btn{
  font-family:var(--font-ui);width:200px;padding:32px 20px;border-radius:18px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  cursor:pointer;font-size:22px;font-weight:600;line-height:1.4;transition:transform 0.12s, border-color 0.12s;
}
.gate-btn:hover{transform:translateY(-3px);}
.gate-btn span{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-top:6px;pointer-events:none;}
.gate-btn.zh{border-color:var(--zh);color:var(--zh);}
.gate-btn.zh:hover{background:var(--zh-dim);}
.gate-btn.de{border-color:var(--de);color:var(--de);}
.gate-btn.de:hover{background:var(--de-dim);}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:0.2px;}
.tagline{color:var(--ink-dim);font-size:13px;margin:2px 0 0;}
.section-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
.section-badge.zh{background:var(--zh-dim);color:#f0c39a;}
.section-badge.de{background:var(--de-dim);color:#9adfcd;}
.card{background:var(--panel);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;border:1px solid var(--line);}
.player{text-align:center;padding:34px 22px 26px;}
.dial{position:relative;width:180px;height:180px;margin:0 auto 22px;}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);}
.dial-track{fill:none;stroke:var(--panel-2);stroke-width:8;}
.dial-progress{fill:none;stroke:var(--amber);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.15s linear;}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial-lang{font-size:12px;letter-spacing:2px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:6px;}
.dial-lang.de{background:var(--de-dim);color:#9adfcd;}
.dial-lang.zh{background:var(--zh-dim);color:#f0c39a;}
.dial-count{font-size:26px;font-weight:600;color:var(--ink);}
.phrase{font-family:var(--font-voice);font-size:24px;line-height:1.35;min-height:64px;margin:0 0 4px;padding:0 8px;}
.progress-index{color:var(--ink-dim);font-size:13px;margin-bottom:20px;}
.controls-main{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:22px;}
.controls-main button{width:44px;height:44px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);cursor:pointer;}
.controls-main button.play{width:58px;height:58px;font-size:20px;background:var(--amber);color:#2a1c05;border-color:var(--amber);}
</style>
</head>
<body>

<div class="app-container">

  <!-- 1. PANTALLA DE PORTADA (SELECCIÓN DE IDIOMA) -->
  <div class="gate" id="langGate">
    <div class="gate-inner">
      <h1>Estación Bilingüe</h1>
      <p class="tagline">¿Qué idioma quieres practicar hoy?</p>
      <div class="gate-buttons">
        <button class="gate-btn zh" data-lang="zh">中文<span>Chino</span></button>
        <button class="gate-btn de" data-lang="de">Deutsch<span>Alemán</span></button>
      </div>
    </div>
  </div>

  <!-- 2. PANTALLA PRINCIPAL DEL REPRODUCTOR (INICIALMENTE OCULTA) -->
  <div class="app" id="mainApp">
    <header>
      <div>
        <h1 id="appTitle">Estación Bilingüe</h1>
        <p class="tagline">Repetición y práctica activa</p>
      </div>
      <span class="section-badge de" id="langBadge">DE</span>
    </header>

    <div class="card player">
      <div class="dial">
        <svg viewBox="0 0 100 100">
          <circle class="dial-track" cx="50" cy="50" r="44"></circle>
          <circle class="dial-progress" id="dialProgress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"></circle>
        </svg>
        <div class="dial-center">
          <span class="dial-lang de" id="dialLang">DE</span>
          <div class="dial-count" id="dialCount">00:00</div>
        </div>
      </div>

      <div class="phrase" id="phraseDisplay">Presiona Play para comenzar</div>
      <div class="progress-index" id="progressIndex">Frase 0 de 0</div>

      <div class="controls-main">
        <button id="btnPrev">⏮</button>
        <button class="play" id="btnPlay">▶</button>
        <button id="btnNext">⏭</button>
      </div>
    </div>
  </div>

</div>

<!-- 🔊 TRUCO PARA EL SEGUNDO PLANO: REPRODUCTOR SILENCIOSO EN LA RAÍZ DEL HTML -->
<audio id="silentBackgroundPlayer" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAD"></audio>

<!-- LÓGICA DE CONTROL DE LA APLICACIÓN -->
<script>
// Base de datos de frases local para pruebas fluidas
const playlistData = {
  de: [
    { texto: "Guten Morgen", duracion: 3 },
    { texto: "Wie geht es dir?", duracion: 4 },
    { texto: "Vielen Dank", duracion: 3 }
  ],
  zh: [
    { texto: "早上好 (Zǎoshang hǎo)", duracion: 3 },
    { texto: "你好吗？(Nǐ hǎo ma?)", duracion: 4 },
    { texto: "谢谢 (Xièxiè)", duracion: 3 }
  ]
};

let currentLang = 'de';
let currentIndex = 0;
let isPlaying = false;
let timerInterval = null;
let currentProgressTime = 0;
let currentMaxDuration = 5;
let audioCtx = null;

// Enlaces del DOM
const langGate = document.getElementById('langGate');
const mainApp = document.getElementById('mainApp');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const phraseDisplay = document.getElementById('phraseDisplay');
const progressIndex = document.getElementById('progressIndex');
const langBadge = document.getElementById('langBadge');
const dialLang = document.getElementById('dialLang');
const dialProgress = document.getElementById('dialProgress');
const silentPlayer = document.getElementById('silentBackgroundPlayer');

// Escucha global de clics para entrar al reproductor de forma segura
document.addEventListener('click', function(e) {
  const boton = e.target.closest('.gate-btn');
  if (!boton) return;

  currentLang = boton.getAttribute('data-lang');
  
  // Transición instantánea de pantallas
  langGate.style.display = 'none';
  mainApp.style.display = 'block';
  
  // Actualizar diseño
  langBadge.textContent = currentLang.toUpperCase();
  langBadge.className = `section-badge ${currentLang}`;
  dialLang.textContent = currentLang.toUpperCase();
  dialLang.className = `dial-lang ${currentLang}`;
  
  currentIndex = 0;
  cargarFrase(currentIndex);
});

function cargarFrase(index) {
  const lista = playlistData[currentLang];
  if (!lista || lista.length === 0) return;

  phraseDisplay.textContent = lista[index].texto;
  progressIndex.textContent = `Frase ${index + 1} de ${lista.length}`;
  
  currentProgressTime = 0;
  currentMaxDuration = lista[index].duracion;
  actualizarContadorGrafico(0);

  // Intentar sincronizar de manera aislada con la pantalla bloqueada
  actualizarPantallaBloqueo(lista[index].texto);

  if (isPlaying) {
    emitirSonidoDePrueba();
    iniciarContadorFrase();
  }
}

// Emulador de audio nativo (Genera pitidos con Web Audio API para no depender de URLs externas)
function emitirSonidoDePrueba() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(currentLang === 'de' ? 440 : 580, audioCtx.currentTime); 
    
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {
    console.log("Audio no permitido aún por el navegador");
  }
}

function iniciarContadorFrase() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
