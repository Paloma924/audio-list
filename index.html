<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estación Bilingüe</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#25333c;
  --panel:#1d2830;
  --panel-2:#2f4049;
  --ink:#f3eee3;
  --ink-dim:#9fb2ba;
  --ink-faint:#6d818a;
  --line:#3d505a;
  --es:#e2483c;
  --es-dim:#5a2e29;
  --de:#3fa38d;
  --de-dim:#204540;
  --zh:#d98a4f;
  --zh-dim:#5a3a20;
  --amber:#eaa23a;
  --radius:14px;
  --font-ui:'Space Grotesk',sans-serif;
  --font-voice:'Fraunces',serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px 64px;
}
.app{width:100%;max-width:760px; display:none;} /* Oculta el reproductor al inicio */

/* Pantalla de selección de idioma */
.gate{
  width:100%;max-width:760px;min-height:70vh;
  display:flex;align-items:center;justify-content:center;
}
.gate-inner{text-align:center;width:100%;}
.gate-inner h1{font-size:30px;font-weight:600;margin:0 0 6px;}
.gate-inner .tagline{color:var(--ink-dim);font-size:14px;margin:0 0 40px;}
.gate-buttons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.gate-btn{
  font-family:var(--font-ui);width:200px;padding:32px 20px;border-radius:18px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  cursor:pointer;font-size:22px;font-weight:600;line-height:1.4;transition:transform 0.12s, border-color 0.12s;
}
.gate-btn:hover{transform:translateY(-3px);}
.gate-btn span{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
.gate-btn.zh{border-color:var(--zh);color:var(--zh);}
.gate-btn.zh:hover{background:var(--zh-dim);}
.gate-btn.de{border-color:var(--de);color:var(--de);}
.gate-btn.de:hover{background:var(--de-dim);}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:0.2px;}
.tagline{color:var(--ink-dim);font-size:13px;margin:2px 0 0;}
.section-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
.section-badge.zh{background:var(--zh-dim);color:#f0c39a;}
.section-badge.de{background:var(--de-dim);color:#9adfcd;}
.header-right{display:flex;align-items:center;gap:10px;}
.card{background:var(--panel);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;border:1px solid var(--line);}
label{font-size:12px;color:var(--ink-dim);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
select,input[type=text],textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:9px 11px;font-family:var(--font-ui);font-size:14px;
}
textarea{resize:vertical;min-height:90px;font-family:var(--font-ui);line-height:1.5;}
select:focus,input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row > div{flex:1;min-width:140px;}
button{
  font-family:var(--font-ui);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:500;
}
button:hover{background:var(--line);}
button:active{transform:scale(0.98);}
button.primary{background:var(--amber);color:#2a1c05;border-color:var(--amber);}
button.primary:hover{background:#f3b358;}
button.ghost{background:transparent;}
button:disabled{opacity:0.4;cursor:default;}
.top-controls{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px;flex-wrap:wrap;}
.empty{color:var(--ink-dim);font-size:14px;text-align:center;padding:30px 10px;}
.player{text-align:center;padding:34px 22px 26px;}
.dial{position:relative;width:180px;height:180px;margin:0 auto 22px;}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);}
.dial-track{fill:none;stroke:var(--panel-2);stroke-width:8;}
.dial-progress{fill:none;stroke:var(--amber);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 0.15s linear;}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial-lang{font-size:12px;letter-spacing:2px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:6px;}
.dial-lang.es{background:var(--es-dim);color:#f4a99f;}
.dial-lang.de{background:var(--de-dim);color:#9adfcd;}
.dial-lang.zh{background:var(--zh-dim);color:#f0c39a;}
.dial-lang.idle{background:var(--panel-2);color:var(--ink-faint);}
.dial-count{font-size:26px;font-weight:600;color:var(--ink);}
.phrase{font-family:var(--font-voice);font-size:24px;line-height:1.35;min-height:64px;margin:0 0 4px;padding:0 8px;}
.phrase.hidden-text{color:var(--ink-faint);font-style:italic;}
.progress-index{color:var(--ink-dim);font-size:13px;margin-bottom:20px;}
.controls-main{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:22px;}
.controls-main button{width:44px;height:44px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;}
.controls-main button.play{width:58px;height:58px;font-size:20px;}
.sliders{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;text-align:left;max-width:420px;margin:0 auto;}
.slider-group{font-size:12px;color:var(--ink-dim);}
.slider-group input{width:140px;vertical-align:middle;}
.toggles{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
.toggles button.active{border-color:var(--amber);color:var(--amber);}
.list-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.list-header h3{font-size:14px;font-weight:600;margin:0;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.5px;}
.item-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-row .txt{flex:1;font-family:var(--font-voice);font-size:15px;}
.item-row .txt.tgt{color:var(--ink-dim);}
.item-row.playing{background:rgba(234,162,58,0.08);border-radius:6px;}
.item-row button{padding:4px 8px;font-size:12px;}
.audio-badge{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--de-dim);color:#9adfcd;white-space:nowrap;}
.bulk-box{margin-top:14px;}
.bulk-box p{font-size:12px;color:var(--ink-faint);margin:6px 0 8px;}
.small-note{font-size:12px;color:var(--ink-faint);margin-top:10px;}
.new-form{display:none;}
.new-form.open{display:block;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.file-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer;}
.file-label:hover{background:var(--line);}
.file-label input{display:none;}
.audio-field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.audio-field .fname{font-size:11px;color:var(--ink-dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.err{color:var(--es);font-size:12px;margin-top:6px;}
.sync-note{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:-10px;margin-bottom:18px;}
.sync-note.error{color:var(--es);}

/* Selector de cajón: Vocabulario / Frases, dentro de cada idioma */
.category-tabs{display:flex;gap:8px;margin-bottom:18px;}
.cat-tab{flex:1;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;}
.cat-tab.active{background:var(--amber);color:#2a1c05;border-color:var(--amber);}
</style>
</head>
<body>

<!-- PANTALLA INICIAL (PUERTA DE IDIOMAS) -->
<div class="gate" id="langGate">
  <div class="gate-inner">
    <h1>Estación Bilingüe</h1>
    <p class="tagline">¿Qué idioma quieres practicar hoy?</p>
    <div class="gate-buttons">
      <button class="gate-btn zh" data-lang="zh">中文<span>Chino</span></button>
      <button class="gate-btn de" data-lang="de">Deutsch<span>Alemán</span></button>
    </div>
  </div>
</div>

<!-- INTERFAZ PRINCIPAL DEL REPRODUCTOR -->
<div class="app" id="mainApp">
  <header>
    <div>
      <h1 id="appTitle">Estación Bilingüe</h1>
      <p class="tagline">Repetición y práctica activa</p>
    </div>
    <span class="section-badge de" id="langBadge">DE</span>
  </header>

  <div class="card player">
    <div class="dial">
      <svg viewBox="0 0 100 100">
        <circle class="dial-track" cx="50" cy="50" r="44"></circle>
        <circle class="dial-progress" id="dialProgress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"></circle>
      </svg>
      <div class="dial-center">
        <span class="dial-lang de" id="dialLang">DE</span>
        <div class="dial-count" id="dialCount">00:00</div>
      </div>
    </div>

    <div class="phrase" id="phraseDisplay">Presiona Play para comenzar</div>
    <div class="progress-index" id="progressIndex">Frase 0 de 0</div>

    <div class="controls-main">
      <button id="btnPrev">⏮</button>
      <button class="play" id="btnPlay">▶</button>
      <button id="btnNext">⏭</button>
    </div>
  </div>
</div>

<!-- 🔊 ELEMENTO OCULTO PARA EL TRUCO DEL AUDIO FANTASMA -->
<!-- Mantiene al móvil despierto en segundo plano reproduciendo un micro-silencio en bucle continuo -->
