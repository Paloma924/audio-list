<!-- CÓDIGO PARA MOVER LAS PANTALLAS Y ACTIVAR EL AUDIO EN SEGUNDO PLANO -->
<script>
// Base de datos de prueba (aquí irán tus audios reales en el futuro)
const playlistData = {
  de: [{ texto: "Guten Morgen", duracion: 3 }, { texto: "Wie geht es dir?", duracion: 4 }],
  zh: [{ texto: "早上好 (Zǎoshang hǎo)", duracion: 3 }, { texto: "你好吗？(Nǐ hǎo ma?)", duracion: 4 }]
};

let currentLang = 'de';
let currentIndex = 0;
let isPlaying = false;
let audioCtx = null;

// Esperamos a que la página cargue para activar los botones
document.addEventListener("DOMContentLoaded", () => {
  
  // 1. Ocultar el reproductor al principio para que solo se vea la portada
  const mainApp = document.getElementById('mainApp') || document.querySelector('.app');
  const langGate = document.getElementById('langGate') || document.querySelector('.gate');
  
  if (mainApp) mainApp.style.display = 'none';

  // 2. Escuchar cuando el usuario pulsa Chino o Alemán
  document.addEventListener('click', function(e) {
    const boton = e.target.closest('.gate-btn');
    if (!boton) return;

    // Detectar idioma
    currentLang = boton.getAttribute('data-lang') || (boton.classList.contains('zh') ? 'zh' : 'de');
    
    // CAMBIO DE PANTALLA: Ocultar portada y mostrar reproductor
    if (langGate) langGate.style.display = 'none';
    if (mainApp) mainApp.style.display = 'block';
    
    // Cargar la primera frase
    cargarFraseProvisional(0);
  });
});

function cargarFraseProvisional(index) {
  const display = document.getElementById('phraseDisplay') || document.querySelector('.phrase');
  const lista = playlistData[currentLang];
  if (display && lista) {
    display.textContent = lista[index].texto;
  }
  // Configurar metadatos para la pantalla bloqueada del móvil
  if ('mediaSession' in navigator && typeof window.MediaMetadata !== 'undefined') {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: lista[index].texto,
      artist: 'Estación Bilingüe',
      album: `Práctica (${currentLang.toUpperCase()})`
    });
  }
}

// Escucha del botón Play principal para el segundo plano
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('play') || e.target.id === 'btnPlay') {
    isPlaying = !isPlaying;
    e.target.textContent = isPlaying ? '⏸' : '▶';
    
    // Activar audio fantasma ultrasilencioso para que el móvil no congele la app al apagar la pantalla
    const silentPlayer = document.getElementById('silentBackgroundPlayer');
    if (silentPlayer) {
      if (isPlaying) silentPlayer.play().catch(() => {});
      else silentPlayer.pause();
    }
  }
});
</script>
